name: shepherd
description: Shepherd — device-free RF sensing tripwire for Silvus StreamCaster mesh radios.
publish_to: "none"
version: 0.26.1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  http: ^1.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2
  universal_ble: ^2.3.0
  # 802.11mc/802.11az WiFi RTT ranging (Android only; guarded at runtime).
  wifi_ftm: ^0.2.0

  # ZMeta invite-code pairing ("Join network"): X25519 keygen, TLS
  # fingerprint pinning, QR of the WireGuard config.
  cryptography: ^2.7.0
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  # ZMeta HTTPS ingest bearer token (secure storage, never prefs).
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/disturbance_clf.json
    - assets/models/track_stitcher.json
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
