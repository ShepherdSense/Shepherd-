sentence=ML-KEM-512 key refresh + gateway-pushed PSK rotation for Shepherd LoRa codec v2 (prototype).
paragraph=Stage/confirm/commit key management shared by lora_node.ino and lora_gateway.ino: Mechanism A derives a fresh PSK from an ML-KEM-512 exchange (vendored PQClean, FIPS 203) authenticated by the current PSK; Mechanism B wraps a pushed PSK in the existing codec v2 CCM wrap. Transport is the devices' Wi-Fi link, never LoRa. Spec: docs/lora_key_refresh_spec.md in the Shepherd repo. Depends on the Shepherd LoRa PSK Codec library (lora_psk_codec.h).
